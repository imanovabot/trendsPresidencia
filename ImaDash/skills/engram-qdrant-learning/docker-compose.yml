version: '3.8'

services:
  # Qdrant: Vector database para memoria semántica
  qdrant:
    image: qdrant/qdrant:latest
    container_name: engram-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - learning

  # API de aprendizaje (opcional, para usar desde Hermes)
  learning-api:
    build: .
    container_name: engram-learning-api
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - COLLECTION_NAME=error_memory
    volumes:
      - ./src:/app/src
    depends_on:
      qdrant:
        condition: service_healthy
    command: >
      sh -c "
        pip install -r requirements.txt &&
        uvicorn src.api:app --host 0.0.0.0 --port 8002
      "
    networks:
      - learning

volumes:
  qdrant_data:

networks:
  learning:
